services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
        CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
        DATABASE_URL: ${DATABASE_URL:-postgresql://easm:easm@db:5432/easm}
    ports:
      - "8050:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://easm:easm@db:5432/easm}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ALLOW_ANON=${ALLOW_ANON:-false}
      - API_KEYS=${API_KEYS:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-1000}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - NVD_API_KEY=${NVD_API_KEY:-}
    volumes:
      # Mount source code for development hot-reload (dev only, overridden in prod)
      - ./backend:/app
      # Exclude target directory to prevent overwriting compiled binaries
      - /app/target
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8050}
      - NODE_ENV=development
      - NEXT_PUBLIC_LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for development hot-reload (dev only, overridden in prod)
      - ./frontend:/app
      # Exclude node_modules and .next to use container-built versions with correct platform binaries
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: easm
      POSTGRES_USER: easm
      POSTGRES_DB: easm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
